name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe JS (hors libs vendorées)
        run: find . -name '*.js' -not -path './libs/*' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
